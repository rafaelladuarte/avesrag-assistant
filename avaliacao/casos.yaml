# Conjunto de avaliação do retriever (plano_assistant1.md §5). Público e versionado.
#
# Cada caso é uma descrição, a espécie esperada e os atributos anotados (o
# gabarito do extrator do Assistant 2): só o que o texto diz e que tem valor no
# vocabulário. Pistas sem valor ("tufinhos", "casinha de barro", o canto) ficam
# só na descrição, que vira o embedding.
#
#   autoria: quem escreveu (pessoa, `llm` ou `claude`)
#   origem:  avistamento | memoria | foto | llm
#   uso:     calibracao (~2/3, para ajustar os pesos) | teste (~1/3, o número que vale);
#            as descrições da mesma espécie ficam no mesmo uso.
#
# 23/11/2026: c001–c003 escritos pelo Claude como exemplo; g001–g044 gerados por
# um LLM (prompt sem acesso às fichas), anotação proposta pelo Claude, a revisar.
# Um segundo lote de 100 descrições geradas foi descartado: erros de fato demais
# (cores trocadas, outra espécie descrita) e ids malformados.
# 24/11/2026: p001–p050 vêm dos formulários com foto (bloco no fim; teste da 1.2,
# depois calibração). Os 15 casos
# gerados que estavam no teste (g010–g015, g018, g024, g025, g028, g029, g031,
# g034, g042, g044) saíram; os gerados ficam só na calibração.
# Inalcançáveis (incompletas, sem documento de busca): sp_crotophaga_ani,
# sp_megarynchus_pitangua.
versao: "1.0"
casos:
  - id: c001
    descricao: "Vi no quintal uma ave um pouco maior que um pardal, com a barriga amarelona e uma listra branca em cima do olho. Ficava pousada no fio e de vez em quando voava pra pegar inseto no ar."
    esperada: sp_pitangus_sulphuratus # bem-te-vi
    autoria: claude
    origem: memoria
    uso: calibracao
    atributos:
      tamanho: [pequeno, medio]
      cores_por_parte: [{ parte: barriga, cor: amarelo }]
      marcas: [sobrancelha]
      ambiente: [parque_jardim]
      o_que_fazia: [pousada, cacando_em_voo]

