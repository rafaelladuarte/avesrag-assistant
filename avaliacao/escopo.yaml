# Conjunto de avaliação do escopo da conversa (planos/plano_guardrails.md §4.2, GR3).
#
# Mede o `fora_de_escopo` do `c01`: quantas mensagens legítimas ele barra por engano (falso
# positivo, o erro caro, porque queima a conversa de um convidado) e quantas mensagens sem
# relação com a ave ele deixa passar. As 87 descrições do `casos.yaml` entram por referência
# (todas devem ser "escopo"); aqui ficam só as mensagens que o `casos.yaml` não cobre.
#
#   grupo:    resposta_curta | descricao_atipica | fora | fronteira
#   esperado: escopo | fora
#   pergunta: a última pergunta do assistente (só em resposta_curta), que o c01 recebe como contexto
#   fala_de_ave: nas mensagens `fora`, se a mensagem CITA ave (uma ave, um grupo ou um nome): escolhe
#             entre os dois textos de recusa ("sobre ave" e "nada a ver"). Não é "é sobre ave de verdade":
#             "vi um pato de borracha" cita pato, e vale true.
#   revisar:  true nas mensagens de FRONTEIRA: o esperado é a proposta do plano, e a decisão é de
#             produto (a Visão é "identificar aves a partir do que se viu"). Troque o `esperado`
#             do que você quiser que passe a valer o contrário.
#
# Nenhuma mensagem daqui pode ser barrada pelos padrões de injeção (P3a): o teste confere, para
# que o resultado meça o `c01` e não o filtro. Injeção tem o conjunto próprio (GR5).
