# Palavras que mostram que uma mensagem fora do escopo fala de ave (planos/plano_guardrails.md §13).
# Só escolhe entre dois textos de recusa: "sobre ave, mas não é identificação" e "nada a ver".
# Os nomes das espécies com ficha entram sozinhos (o índice do sugestor); aqui ficam as palavras
# genéricas e os grupos que as pessoas dizem sem o nome completo ("tucano", "coruja"). O plural
# ("aves", "tucanos") é tratado pelo código. Mudou a lista: rode o teste de `escopo.yaml`.
versao: "1.0"
palavras_de_ave:
