# Pesos da reordenação do retriever (plano_assistant1.md §3.3).
# Os valores iniciais são um palpite. O ajuste é feito à mão só com os casos de
# calibração e registrado aqui, com a data e o resultado.
# Histórico:
#   1.0 (23/11) linha de base: plano_assistant1.md §13.
#   1.1 (23/11) seção `hibrido` (modo novo; os pesos não mudaram). Resultado na
#       calibração logo abaixo da seção.
#   1.2 (24/11) vetor.peso de 1.0 para 0.4, por varredura na calibração
#       (plano_assistant1.md §13.2). A penalidade do conflito ficou em 0.5:
#       baixá-la piorou o top 3 em todos os pesos testados.
#   1.3 (24/11) `hibrido.atributos: 40`: o híbrido traz também as 40 espécies
#       com mais pontos nos atributos entre todas as fichas, sem depender do
#       vetor (plano_assistant1.md §13.4 e §13.5). A raridade e as cores
#       vizinhas foram testadas e descartadas: não melhoraram o top 3.
#   1.4 (24/11) seção `sugestoes`: as espécies que o LLM sugere (`c04_candidatas`)
#       entram como candidatas e ganham bônus pela posição na lista
#       (plano_assistant2.md §13.2). Bônus 2.0 escolhido na calibração entre
#       0.25, 0.5, 1, 2 e 4.
#   1.5 (24/11) sugestoes.bonus de 2.0 para 1.0: com as perguntas, o bônus de 2.0
#       trava a lista (a 1ª sugestão errada não sai com 3 respostas); com 1.0, o
#       top 3 das pessoas vai a 70% depois de 3 perguntas no usuário simulado
#       (plano_assistant2.md §13.3). Decisão da usuária.
versao: "1.5"

vetor:
  peso: 0.4          # peso da nota do vetor, normalizada entre a menor e a maior das candidatas
  candidatos: 400    # numCandidates do $vectorSearch
  documentos: 120    # limit do $vectorSearch (documentos, até 3 por espécie)
  especies: 40       # espécies que seguem para a reordenação

penalidade_conflito: 0.5   # `conflita` tira peso × penalidade; `sem_dado` é neutro

pesos:             # pontos por atributo que bate
  cores_por_parte: 0.6
  cores: 0.4
  marcas: 0.4
  bico: 0.4
  tamanho: 0.3
  cauda: 0.3
  o_que_fazia: 0.2
  onde_estava: 0.2
  ambiente: 0.2
  grupo: 0.1
  atividade: 0.3

hibrido:             # modo `hibrido`: buscas extras com os atributos como filtro
  especies: 20       # espécies que cada nível acrescenta, no máximo
  atributos: 40      # espécies com mais pontos nos atributos, entre todas as fichas (0 desliga)
  niveis:            # do mais estrito ao mais solto; o bico não entra (o índice não o filtra)
    - nome: completo
      atributos: todos
    - nome: aparencia
      atributos: [cores, cores_por_parte, marcas, tamanho, cauda]
    - nome: cores
      atributos: [cores, cores_por_parte]
sugestoes:           # espécies sugeridas pelo LLM; sem a seção, a busca as ignora
  bonus: 1.0         # bônus da 1ª sugerida; a da posição i (a partir de 0) ganha bonus × (1 − i/maximo)
  maximo: 10         # sugestões consideradas, no máximo

# Resultado da 1.1 (23/11, calibração, 32 casos; o teste ainda não foi rodado):
#   reordenado  top1 41%  top3 47%  top10 62%  mediana 5
#   hibrido     top1 44%  top3 59%  top10 75%  mediana 2   (~49 espécies reordenadas)
# Resultado da 1.2 (24/11, calibração, 32 casos; o teste ainda não foi rodado):
#   reordenado  top1 41%  top3 62%  top10 66%  mediana 2
#   hibrido     top1 50%  top3 66%  top10 78%  mediana 1.5
# Resultado da 1.3 (24/11, calibração nova: 82 casos, 50 de pessoas; teste: só c002 e f003
# até a próxima rodada dos formulários):
#   hibrido  pessoas  top1 8%   top3 10%  top10 36%  (1.2: 4% / 12% / 26%)
#   hibrido  outros   top1 47%  top3 62%  top10 75%  (1.2: 50% / 66% / 78%)
# Resultado da 1.5 (24/11, calibração, `avaliar --sugestoes`; com as perguntas, ver conversa.yaml):
#   hibrido  pessoas  top1 28%  top3 44%  top10 54%
#   hibrido  outros   top1 81%  top3 88%  top10 94%
# Resultado da 1.4 (24/11, calibração, `avaliar --sugestoes`, c04_candidatas 1.0):
#   hibrido  pessoas  top1 32%  top3 46%  top10 54%  (experimento: 30% / 38% / 46%)
#   hibrido  outros   top1 84%  top3 94%  top10 97%  (inflado: descrições geradas por LLM)
