[project]
name = "avesrag-assistant"
version = "2.0.0.dev0"
description = "Assistente que identifica aves do Cerrado a partir de uma descrição em texto"
authors = [{ name = "Rafaella Duarte" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    # Vocabulário, regras de bico, nomes das collections e interface de LLM.
    # Instalado por caminho (ver [tool.poetry.dependencies]): os dois repositórios
    # ficam clonados lado a lado.
    "avesrag-dataset-builder",
    "pymongo",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.2.1,<3",
    "pyyaml>=6.0.3,<7",
    "typer>=0.29.2,<0.30",
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "openai (>=3.59.0,<4.0.0)",
]

[project.scripts]
avesrag-assistant = "avesrag_assistant.cli:app"

[tool.poetry]
packages = [{ include = "avesrag_assistant", from = "src" }]

[tool.poetry.dependencies]
avesrag-dataset-builder = { path = "../avesrag-dataset-builder", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.17.6"
pre-commit = "^4.7.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: testes demorados",
    "integration: precisa do MongoDB do builder de pé (docker compose up -d no builder)",
]
addopts = "-m 'not slow and not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
